[project]
name = "sql-exercise"
version = "0.1.0"
description = "Hands-on SQL interview exercise: generated dataset with planted traps, run in DuckDB"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "harlequin>=2.17.0",
]

[project.scripts]
generate-dataset = "generate_dataset:main"
answer-key = "answer_key:main"
ide = "harlequin.cli:harlequin"
sql = "sql_shell:main"
ui = "sql_shell:ui"
reveal = "reveal:main"

[tool.harlequin]
default_profile = "exercise"

[tool.harlequin.profiles.exercise]
adapter = "duckdb"
conn_str = ["data/exercise.duckdb"]
theme = "monokai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["generate_dataset.py", "answer_key.py", "sql_shell.py", "reveal.py"]
